<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <defs>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Presse-papiers simplifié -->
  <!-- Clip -->
  <rect x="6" y="2" width="8" height="2" rx="1" fill="currentColor" opacity="0.6"/>
  
  <!-- Corps -->
  <rect x="4" y="3" width="12" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Lignes -->
  <line x1="6.5" y1="7" x2="13.5" y2="7" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="6.5" y1="10" x2="13.5" y2="10" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Case cochée -->
  <rect x="6.5" y="12.5" width="2.5" height="2.5" rx="0.5" fill="currentColor"/>
  <polyline points="7,14 7.8,14.8 9.5,13" fill="none" stroke="white" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>