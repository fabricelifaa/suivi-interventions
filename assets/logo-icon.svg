<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond arrondi -->
  <rect width="128" height="128" rx="24" fill="url(#iconGradient)"/>
  
  <!-- Presse-papiers -->
  <g>
    <!-- Clip -->
    <rect x="40" y="20" width="48" height="10" rx="5" fill="white" opacity="0.3"/>
    
    <!-- Corps -->
    <rect x="32" y="24" width="64" height="80" rx="6" fill="white"/>
    
    <!-- Lignes de texte -->
    <line x1="44" y1="40" x2="84" y2="40" stroke="#E0E0E0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="52" x2="75" y2="52" stroke="#E0E0E0" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Case cochée -->
    <rect x="44" y="64" width="12" height="12" rx="2" fill="url(#checkGradient)"/>
    <polyline points="46,70 49,73 53,67" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="60" y1="70" x2="84" y2="70" stroke="url(#checkGradient)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Case vide -->
    <rect x="44" y="82" width="12" height="12" rx="2" fill="none" stroke="#E0E0E0" stroke-width="2"/>
    <line x1="60" y1="88" x2="75" y2="88" stroke="#E0E0E0" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>